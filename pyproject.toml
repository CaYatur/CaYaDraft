[project]
name = "cayadraft"
version = "0.1.0"
description = "Local GitHub bot that drafts with Ollama and opens reviewable pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Çağan Turgut" }]
dependencies = ["httpx>=0.27,<1", "PyJWT[crypto]>=2.9,<3"]

[project.scripts]
cayadraft = "cayadraft.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cayadraft*"]
